apiVersion: batch/v1
kind: Job
metadata:
  name: kai-bn8-small-a8-std
  labels:
    app: bnjet-r8-std
    bnv: "std-small-a8"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: bnjet-r8-std
        bnv: "std-small-a8"
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
                - NVIDIA-L4
                - NVIDIA-GeForce-RTX-2080-Ti
                - Tesla-V100-SXM2-32GB
                - Tesla-V100-SXM2-16GB
                - Tesla-V100-PCIE-16GB
                - NVIDIA-RTX-A4000
                - NVIDIA-TITAN-RTX
                - Quadro-RTX-6000
                - NVIDIA-RTX-5000-Ada-Generation
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-RTX-A5000
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-A100-PCIE-40GB
          preferredDuringSchedulingIgnoredDuringExecution:
          # prefer the plentiful mid-tier first — these jobs do not need more.
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A10, NVIDIA-L4, NVIDIA-GeForce-RTX-2080-Ti, NVIDIA-RTX-A4000]
          - weight: 80
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [Tesla-V100-SXM2-32GB, Tesla-V100-SXM2-16GB, Tesla-V100-PCIE-16GB, NVIDIA-GeForce-RTX-3090]
          - weight: 40
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-RTX-A5000, NVIDIA-A40, NVIDIA-RTX-A6000, NVIDIA-L40, NVIDIA-TITAN-RTX]
      containers:
      - name: train
        image: tensorflow/tensorflow:2.11.1-gpu
        command: ["bash", "-c"]
        args:
        - |
          set -eo pipefail
          export MPLBACKEND=Agg
          export TF_FORCE_GPU_ALLOW_GROWTH=true
          mkdir -p /work/code /work/data /work/out/bitnet
          cp /qkcode/qkerasModel.py /work/code/
          # py3.8 in the TF 2.11 image: make sure modern annotations don't crash import
          grep -q "from __future__ import annotations" /work/code/qkerasModel.py || \
            sed -i '1i from __future__ import annotations' /work/code/qkerasModel.py
          export PYTHONPATH="/work/code:$PYTHONPATH"
          echo "[setup] $(date) deps"
          apt-get update -qq && apt-get install -y -qq graphviz
          pip install -q qkeras==0.9.0 "tensorflow==2.11.1" "matplotlib<3.8" pandas seaborn mplhep pydot scikit-learn h5py wandb
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
          export WANDB_PROJECT=bnjettag-bitnet
          export WANDB_RUN_NAME=r8-small-a8-std

          # GATE: this job REQUIRES a ConfigMap carrying the 2026-07-13 qkerasModel.py.
          # If kai-qkerasmodel-r5 is stale, BN_STANDARDIZE is silently a no-op and the run is
          # just a duplicate of kai-bn7d-small-a8-long — fail loudly instead.
          grep -q "BN_STANDARDIZE" /work/code/qkerasModel.py || {
            echo "[fatal] the mounted qkerasModel.py has no BN_STANDARDIZE knob — the ConfigMap"
            echo "        kai-qkerasmodel-r5 is STALE. Refresh it from code/training/qkerasModel.py:"
            echo "        kubectl create configmap kai-qkerasmodel-r5 \\"
            echo "          --from-file=qkerasModel.py=bnjettag/code/training/qkerasModel.py \\"
            echo "          --dry-run=client -o yaml | kubectl apply -f -"
            exit 1; }

          echo "[data] $(date) fetching HLS4ML LHC Jet 150p TRAIN split from Zenodo (2.7 GB)"
          python -u -c 'import urllib.request; urllib.request.urlretrieve(
            "https://zenodo.org/records/3602260/files/hls4ml_LHCjet_150p_train.tar.gz?download=1",
            "/work/data/train.tar.gz")'
          sz=$(stat -c %s /work/data/train.tar.gz); echo "[data] tarball bytes: $sz"
          [ "$sz" -gt 2500000000 ] || { echo "[fatal] train tarball too small"; exit 1; }
          tar -xzf /work/data/train.tar.gz -C /work/data && rm /work/data/train.tar.gz
          DATA=$(dirname "$(find /work/data -name 'jetImage_*.h5' -print -quit)")
          [ -n "$DATA" ] || { echo "[fatal] no jetImage_*.h5 after extract"; exit 1; }
          echo "[data] DATA=$DATA ($(ls "$DATA" | wc -l) files)"

          # ---- THE EXPERIMENT -------------------------------------------------------------
          # Exact A/B twin of kai-bn7d-small-a8-long (same arch, LR, schedule, seed, ES) with
          # ONE knob flipped: BN_STANDARDIZE=1. That job is the CONTROL — do not re-tune anything
          # here, or the comparison is worthless.
          #
          # Hypothesis (bug diagnosed 2026-07-13): the 16 raw constituent features are NOT on a
          # common scale — per-feature std spans 0.0394 .. 117.49 (2,979x) on the real top-10-by-pT
          # inputs. The first op is BitLinear(input_proj) whose SubLN normalises ACROSS the 16
          # features, so the LN is dominated by the GeV momenta and the POST-LN std comes out 1.40
          # (px/py/pz) vs ~0.185 (etarel/phirel/ptrel/deltaR/costhetarel) — an 8.9x imbalance. A
          # BitLinear has {-beta,+beta} weights with ONE per-tensor beta, so there is no per-feature
          # gain to learn: the small features are permanently under-weighted, and the A8 absmax
          # quantizer (range set by the momenta) costs them ~3 more bits. FP32 learns w ~ 1/std and
          # escapes; BINARY structurally cannot. Standardizing BEFORE the LN (they do not commute)
          # drops the post-LN imbalance 8.9x -> 2.1x.
          # Control plateaued at ~42% train acc / train_auc ~0.72 at 18,405 params.
          #
          # FPGA: a FIXED per-feature affine (16 const mults + 16 adds), CSD/LUT-implementable,
          # 0 DSP in the binary core, NOT a data-dependent normalization.
          # ---------------------------------------------------------------------------------
          export BN_STANDARDIZE=1
          # deployable scale `small` -> 18405 params (round-7, 2026-07-13). The affine adds ZERO
          # trainable parameters, so the param gate below is UNCHANGED and doubles as a check that
          # the transform stayed OUT of the model graph (it is a preprocessing step, not a layer).
          export BN_D_MODEL=32 BN_N_HEADS=4 BN_N_LAYERS=2 BN_FFN_DIM=64
          export BN_N_PART=10
          export BN_WARMUP_EPOCHS=3 BN_DECAY_EPOCHS=120 BN_DECAY_POWER=1.0 BN_BETA2=0.98 BN_WEIGHT_DECAY=0.01 BN_CLIPNORM=1.0 BN_L1_REG=0 BN_BATCH=256 BN_ES_MONITOR=val_auc BN_ES_MODE=max BN_ES_PATIENCE=25 BN_LR=0.00005
          export BN_VARIANT=bitnet BN_ACT_BITS=8 BN_SEED=1

          echo "[preflight] $(date) --sanity build + standardizer self-test + param-count gate"
          env CUDA_VISIBLE_DEVICES=-1 python -u /work/code/qkerasModel.py --sanity 2>&1 | tail -8
          env CUDA_VISIBLE_DEVICES=-1 python -u - <<'PYGATE'
          import qkerasModel as M
          assert M.STANDARDIZE is True, "BN_STANDARDIZE did not reach the trainer"
          n = M.build_bitnet_jet_tagger().count_params()
          print(f"[params] built={n} expected=18405  (standardization must add 0 params)")
          assert n == 18405, f"PARAM GATE FAILED: {n} != 18405"
          print("[params] OK")
          PYGATE
          echo "[train] $(date) r8-small-a8-std  size=small D=32 H=4 L=2 FFN=64 params=18405  BN_STANDARDIZE=1,BN_VARIANT=bitnet,BN_ACT_BITS=8,BN_SEED=1,BN_LR=0.00005"
          cd /work/out
          python -u /work/code/qkerasModel.py "$DATA" 2>&1 | tee /work/out/train_std-small-a8.log

          # /work is an emptyDir: the checkpoint AND the standardizer constants only survive via
          # W&B (qkerasModel wandb.save()s both, and also puts mean/std into the run config).
          # THEY MUST TRAVEL TOGETHER — the 16 mean/std values are part of this model's definition.
          # make_roc.py HARD-FAILS rather than evaluate this checkpoint on raw inputs, so a
          # forgotten sidecar surfaces as an error, never as a quietly wrong AUC.
          echo "[artifacts] $(date)"
          ls -l /work/out/bitnet/
          echo "[artifacts] standardizer constants (part of the model — keep with the .h5):"
          cat /work/out/bitnet/noNorm_train_standardizer.json
          echo "[done] $(date) r8-small-a8-std"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: kai-wandb
              key: WANDB_API_KEY
        # Right-sized for deployable scale (same as the round-7 control). load_hls4ml_jets slices
        # to n_part=10 as it reads, so the resident dataset is (~880k,10,16) f32 ~= 0.6 GB. The
        # standardizer fit is chunked (float64 working set ~80 MB) and the affine allocates one
        # extra (~880k,10,16) f32 array, so peak grows by ~0.6 GB — still far inside 8Gi.
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 8Gi
            cpu: "2"
            ephemeral-storage: 24Gi
          requests:
            nvidia.com/gpu: "1"
            memory: 8Gi
            cpu: "2"
            ephemeral-storage: 20Gi
        volumeMounts:
        - name: qkcode
          mountPath: /qkcode
        - name: work
          mountPath: /work
      volumes:
      - name: qkcode
        configMap:
          name: kai-qkerasmodel-r5   # MUST carry the 2026-07-13 qkerasModel.py (gated above)
      - name: work
        emptyDir:
          sizeLimit: 24Gi
