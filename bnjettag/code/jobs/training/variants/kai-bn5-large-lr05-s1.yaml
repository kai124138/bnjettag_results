apiVersion: batch/v1
kind: Job
metadata:
  name: kai-bn5-large-lr05-s1
  labels:
    app: bnjet-variant-r5
    bnv: "large-lr05-s1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: bnjet-variant-r5
        bnv: "large-lr05-s1"
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-H100-80GB-HBM3
                - NVIDIA-H200-NVL
                - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-L40S
                - NVIDIA-L40
                - NVIDIA-RTX-A6000
                - NVIDIA-A40
                - NVIDIA-RTX-A5000
                - NVIDIA-GeForce-RTX-3090
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-H200-NVL, NVIDIA-H100-80GB-HBM3, NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition]
          - weight: 90
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A100-SXM4-80GB, NVIDIA-A100-80GB-PCIe, NVIDIA-GeForce-RTX-4090, NVIDIA-L40S]
          - weight: 80
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A100-PCIE-40GB, NVIDIA-L40, NVIDIA-RTX-A6000]
          - weight: 60
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A40, NVIDIA-RTX-A5000, NVIDIA-GeForce-RTX-3090]
      containers:
      - name: train
        image: tensorflow/tensorflow:2.11.1-gpu
        command: ["bash", "-c"]
        args:
        - |
          set -eo pipefail
          export MPLBACKEND=Agg
          export TF_FORCE_GPU_ALLOW_GROWTH=true
          CODE=/data/BNJetTag
          OUT=/data/outputs/qk-variants-r5/large-lr05-s1
          mkdir -p "$OUT/bitnet" "$OUT/v1/bitnet"
          echo "[setup] $(date) deps"
          apt-get update -qq && apt-get install -y -qq graphviz
          pip install -q qkeras==0.9.0 "tensorflow==2.11.1" "matplotlib<3.8" pandas seaborn mplhep pydot scikit-learn h5py wandb
          ( grep -rl " | " --include="*.py" "$CODE" 2>/dev/null | while read f; do grep -q "from __future__ import annotations" "$f" || sed -i '1i from __future__ import annotations' "$f"; done ) || true
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
          export PYTHONPATH="$CODE:$PYTHONPATH"
          export WANDB_PROJECT=bnjettag-bitnet
          export WANDB_RUN_NAME=r5-large-lr05-s1
          # ---- SEED-CONFIRM: binary W1A8 large @ 5e-5, seed=1 (r4 unseeded run = 0.7672). ----
          # (NB: any AUC in the note above is an OLD-dataset number — round-5 is the
          #  first round on the HLS4ML LHC Jet 150p dataset; see decisions.md 2026-07-01.)
          # Architecture FIXED at large (decision 2026-06-29): D256/L8/H8/FFN1024.
          # Param count differs slightly from the old 6,373,633 (input is now 16
          # feats, head 5 classes) — preflight_r5.sh prints the exact new count.
          export BN_D_MODEL=256 BN_N_HEADS=8 BN_N_LAYERS=8 BN_FFN_DIM=1024
          # top-10 constituents by pT (advisor guidance 2026-07-01; 10x16=160 inputs)
          export BN_N_PART=10
          export BN_LR=0.00005 BN_WARMUP_EPOCHS=1 BN_DECAY_EPOCHS=40 BN_DECAY_POWER=1.0 BN_BETA2=0.98 BN_WEIGHT_DECAY=0.01 BN_CLIPNORM=1.0 BN_L1_REG=0 BN_BATCH=256 BN_ES_MONITOR=val_auc BN_ES_MODE=max BN_ES_PATIENCE=10
          export BN_VARIANT=bitnet BN_ACT_BITS=8 BN_SEED=1
          echo "[train] $(date) r5-large-lr05-s1  D=256 H=8 L=8 FFN=1024  BN_VARIANT=bitnet,BN_ACT_BITS=8,BN_SEED=1"
          cd "$OUT"
          python -u "$CODE/qkerasModel.py" \
            /data/hls4ml_lhc_jet/train/train \
            2>&1 | tee "$OUT/train_large-lr05-s1.log"
          echo "[done] $(date) r5-large-lr05-s1"
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: kai-wandb
              key: WANDB_API_KEY
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 24Gi
            cpu: "4"
          requests:
            nvidia.com/gpu: "1"
            memory: 24Gi
            cpu: "4"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kai-data
