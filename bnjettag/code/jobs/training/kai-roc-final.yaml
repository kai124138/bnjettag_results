# kai-roc-final.yaml — FINAL-campaign ROC/eval (era-2, HGQ2-native checkpoints).
#
# NOTE (2026-07-07): this CPU/PVC variant is SUPERSEDED as the campaign default by
# kai-roc-final-gpu.yaml — the PRIMARY final-campaign ROC job. This CPU version hit its
# 8 h deadline mid-matrix (15 QAT KBI-quantizer models are far slower on 4 CPUs than the
# r5 QKeras ones), and the final checkpoints trained PVC-free so they live only on W&B.
# Kept for the record / for a future PVC-mounted CPU re-run; use the GPU job to evaluate.
#
# Evaluates the 15 FINAL checkpoints (5 variants × 3 seeds, decisions.md 2026-07-07)
# on the era-2 held-out val split and writes the verifiable ROC deliverables.
# CPU only (no GPU). Pattern: kai-roc-r5-pvcfree.yaml, but PVC-first (the 07-02 ceph
# incident is resolved — experiment-log 2026-07-07) with W&B as the durable channel.
#
# Data flow
#   code   : PVC  /data/BNJetTag-hgq2/   (bnhgq2/ + roc_final.py + hls_templates/;
#            synced by the training-side agent — this job does NOT sync it)
#   models : PVC  /data/outputs/final/<variant>-s<seed>/model_best.keras   (CKPT_SOURCE=pvc)
#            fallback per-missing-checkpoint -> W&B run final-<variant>-s<seed>
#   data   : PVC  /data/hls4ml_lhc_jet/val/val   (the held-out split; n=260000 asserted)
#   out    : PVC  /data/outputs/final/roc/  (*.npz, roc_auc.md, roc_overlay.png)
#            AND W&B run final-roc-artifacts (project bnjettag-final) — durable copy
#
# Knobs (env): CKPT_SOURCE=pvc|wandb.  Skip-if-missing per checkpoint => a partial
# matrix still evaluates and plots whatever finished.
#
# Env pins mirror the training/.venv-hgq2 stack (read 2026-07-07):
#   python 3.12 · keras 3.15.0 · tensorflow(-cpu) 2.21.0 · hgq2 0.1.9 · hls4ml 1.3.0 ·
#   quantizers 1.2.2 · numpy 2.5.0 · ml_dtypes 0.5.4 · scikit-learn 1.9.0 · h5py 3.14.0 ·
#   matplotlib 3.11.0 · wandb 0.28.0
#
# Apply:  kubectl apply -f kai-roc-final.yaml -n cms-ml
# Watch:  kubectl logs -f job/kai-roc-final -n cms-ml
apiVersion: batch/v1
kind: Job
metadata:
  name: kai-roc-final
  labels:
    app: kai-roc-final
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 28800
  template:
    metadata:
      labels:
        app: kai-roc-final
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
      containers:
      - name: roc
        image: python:3.12-slim
        command: ["bash", "-c"]
        args:
        - |
          set -eo pipefail
          export MPLBACKEND=Agg
          export KERAS_BACKEND=tensorflow
          export CUDA_VISIBLE_DEVICES=""
          export TF_CPP_MIN_LOG_LEVEL=2
          export WANDB_ENTITY=kayamaguchi-uc-san-diego
          CODE=/data/BNJetTag-hgq2
          DATA=/data/hls4ml_lhc_jet/val/val
          OUT=/data/outputs/final/roc
          mkdir -p "$OUT"

          echo "[preflight] $(date)"
          [ -f "$CODE/roc_final.py" ] || { echo "[fatal] $CODE/roc_final.py missing — training agent must sync code/hgq2 -> $CODE"; exit 1; }
          [ -d "$CODE/bnhgq2" ]       || { echo "[fatal] $CODE/bnhgq2 missing"; exit 1; }
          [ -f "$CODE/hls_templates/nnet_subln.h" ] || { echo "[fatal] $CODE/hls_templates/nnet_subln.h missing (register_subln needs it)"; exit 1; }
          [ -d "$DATA" ] || { echo "[fatal] held-out val split $DATA missing on PVC"; exit 1; }
          echo "[data] $DATA has $(ls "$DATA"/*.h5 2>/dev/null | wc -l) .h5 files"

          echo "[provenance] $(date) package fingerprints"
          ( cd "$CODE" && find bnhgq2 -name '*.py' | sort | xargs md5sum | md5sum | sed 's/-$/bnhgq2\/*.py (rolled)/' )
          md5sum "$CODE/roc_final.py" || true

          echo "[setup] $(date) pip deps (pinned to the training env)"
          pip install --no-cache-dir -q \
            "numpy==2.5.0" "ml_dtypes==0.5.4" "tensorflow-cpu==2.21.0" "keras==3.15.0" \
            "hgq2==0.1.9" "hls4ml==1.3.0" "quantizers==1.2.2" \
            "scikit-learn==1.9.0" "h5py==3.14.0" "matplotlib==3.11.0" "wandb==0.28.0"

          export BN_N_PART=10
          echo "[eval] $(date) matrix (CKPT_SOURCE=${CKPT_SOURCE:-pvc})"
          python -u "$CODE/roc_final.py" eval-all \
            --data "$DATA" \
            --ckpt-root /data/outputs/final \
            --ckpt-source "${CKPT_SOURCE:-pvc}" \
            --allow-wandb-fallback \
            --wandb-project bnjettag-final --entity kayamaguchi-uc-san-diego \
            --out "$OUT" \
            --expect-n 260000 --batch 8192 \
            --title "FINAL BitNet jet tagger — ROC (era-2 HLS4ML LHC Jet, held-out val, 5 variants × 3 seeds)"

          echo "[upload] $(date) durable copies -> W&B run final-roc-artifacts (project bnjettag-final)"
          python -u - <<'PYEOF'
          import glob, os, wandb
          run = wandb.init(project="bnjettag-final", name="final-roc-artifacts",
                           job_type="roc-artifacts")
          for p in sorted(glob.glob("/data/outputs/final/roc/*")):
              if os.path.isfile(p):
                  wandb.save(p, base_path="/data/outputs/final/roc", policy="now")
                  print("[upload]", p, flush=True)
          run.finish()
          PYEOF
          echo "[done] $(date) FINAL ROC complete — PVC $OUT + W&B final-roc-artifacts"
        env:
        - name: CKPT_SOURCE
          value: "wandb"               # knob: pvc | wandb. MUST be wandb for the final
          #  campaign: training runs PVC-free (2026-07-07 CSI incident tail), so
          #  checkpoints exist ONLY as W&B run files — the pvc default would skip
          #  every model and produce an empty ROC.
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: kai-wandb
              key: WANDB_API_KEY
        resources:
          requests:
            cpu: "6"
            memory: 24Gi
            ephemeral-storage: 16Gi
          limits:
            cpu: "10"
            memory: 32Gi
            ephemeral-storage: 24Gi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kai-data
