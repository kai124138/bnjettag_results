# kai-roc-r8x-gpu.yaml — ROUND-7 EXTENSION held-out ROC/eval, GPU + PVC-FREE.
#
# The held-out test pass for the 8 round-7 follow-up checkpoints (experiment-log
# 2026-07-15): W1A4-small seeds 4-6 (instability extension), tiny's LR probe
# (lr1e5/lr5e5, seed 1), and the norm ablation (nonorm, seeds 1-3). These runs do
# NOT fit eval-all's <prefix>-<size>-<variant>-s<seed> matrix naming, so this job
# downloads each checkpoint by EXACT W&B run display name (exactly-one assertion —
# the dup-name lesson) and uses roc_final.py's single-run `eval` with --keras.
# Everything else mirrors the proven kai-roc-r7-gpu.yaml (python:3.12 + and-cuda
# pips + LD_LIBRARY_PATH fix; Zenodo val with the >1e9 guard; ConfigMap code;
# BAD_NODES fence; backoffLimit 2; same n=260000 assert).
#   out: 8 npz -> W&B run r8x-roc-artifacts (project bnjettag-final). NO PVC.
#
# Prereq: ConfigMap kai-bnf-code current (md5 f4f2e70a or later — needs the
#         arch.norm='none' bnhgq2 so the nonorm checkpoints deserialize).
# Apply : kubectl apply -f kai-roc-r8x-gpu.yaml -n cms-ml
apiVersion: batch/v1
kind: Job
metadata:
  name: kai-roc-r8x-gpu
  labels:
    app: kai-roc-r7
    bnf: "roc-r8x-gpu"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app: kai-roc-r7
        bnf: "roc-r8x-gpu"
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [k8s-chase-ci-07.calit2.optiputer.net, ry-gpu-08.sdsc.optiputer.net, suncave-1, suncave-2, suncave-3, suncave-4, suncave-5, suncave-6, suncave-7, suncave-8, suncave-9, suncave-10, suncave-11, suncave-12, suncave-13, suncave-14, suncave-15, suncave-16, suncave-17, suncave-18, suncave-19, suncave-20]
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-H100-80GB-HBM3
                - NVIDIA-H200-NVL
                - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-L40S
                - NVIDIA-L40
                - NVIDIA-RTX-A6000
                - NVIDIA-A40
                - NVIDIA-RTX-A5000
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L4
                - Tesla-V100-SXM2-32GB
                - Tesla-V100-SXM2-16GB
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A10, NVIDIA-L4, Tesla-V100-SXM2-32GB, Tesla-V100-SXM2-16GB, NVIDIA-A40, NVIDIA-RTX-A5000, NVIDIA-GeForce-RTX-3090]
          - weight: 60
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-GeForce-RTX-4090, NVIDIA-L40S, NVIDIA-L40, NVIDIA-RTX-A6000]
          - weight: 20
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A100-SXM4-80GB, NVIDIA-A100-80GB-PCIe, NVIDIA-A100-PCIE-40GB]
          - weight: 10
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-H200-NVL, NVIDIA-H100-80GB-HBM3, NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition]
      containers:
      - name: roc
        image: python:3.12
        command: ["bash", "-c"]
        args:
        - |
          set -eo pipefail
          export KERAS_BACKEND=tensorflow MPLBACKEND=Agg TF_FORCE_GPU_ALLOW_GROWTH=true
          export WANDB_PROJECT=bnjettag-final WANDB_ENTITY=kayamaguchi-uc-san-diego
          mkdir -p /work/code /work/data /work/outputs /work/ckpt_dl
          CODE=/work/code
          OUT=/work/outputs/roc
          mkdir -p "$OUT"
          echo "[code] $(date) unpack code from ConfigMap kai-bnf-code (PVC-free)"
          tar -xzf /cmcode/hgq2.tar.gz -C "$CODE" --strip-components=1
          md5sum /cmcode/hgq2.tar.gz | awk '{print "[code] configmap tar md5:", $1}'
          [ -f "$CODE/roc_final.py" ] || { echo "[fatal] roc_final.py missing in ConfigMap"; exit 1; }
          [ -f "$CODE/hls_templates/nnet_subln.h" ] || { echo "[fatal] hls_templates/nnet_subln.h missing (register_subln needs it)"; exit 1; }
          export PYTHONPATH="$CODE:$PYTHONPATH"
          echo "[setup] $(date) pinned deps (mirror .venv-hgq2)"
          pip install -q --no-cache-dir "tensorflow[and-cuda]==2.21.0" "keras==3.15.0" "hgq2==0.1.9" "quantizers==1.2.2" "scikit-learn==1.9.0" "h5py==3.14.0" "wandb==0.28.0" "hls4ml==1.3.0" "numpy==2.5.0" "matplotlib==3.11.0"
          NVLIBS=$(python -c "import glob; print(':'.join(sorted(glob.glob('/usr/local/lib/python*/site-packages/nvidia/*/lib'))))")
          export LD_LIBRARY_PATH="$NVLIBS${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "[gpu] $(date) nvidia-smi + TF backend assertion"
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || { echo "[fatal] no nvidia-smi / GPU"; exit 1; }
          python -c "import os; os.environ.setdefault('KERAS_BACKEND','tensorflow'); import tensorflow as tf; g=tf.config.list_physical_devices('GPU'); assert g, 'NO GPU visible to TensorFlow'; print('[gpu] TF sees', g)"

          echo "[data] $(date) fetch HLS4ML LHC Jet 150p VAL split from Zenodo (~1.14 GB, PVC-free)"
          python -u -c 'import urllib.request; urllib.request.urlretrieve("https://zenodo.org/records/3602260/files/hls4ml_LHCjet_150p_val.tar.gz?download=1", "/work/data/val.tar.gz")'
          sz=$(stat -c %s /work/data/val.tar.gz); echo "[data] tarball bytes: $sz"
          [ "$sz" -gt 1000000000 ] || { echo "[fatal] val tarball too small ($sz < 1e9)"; exit 1; }
          tar -xzf /work/data/val.tar.gz -C /work/data && rm -f /work/data/val.tar.gz
          DATA=$(dirname "$(find /work/data -name 'jetImage_*.h5' -print -quit)")
          [ -n "$DATA" ] || { echo "[fatal] no jetImage_*.h5 after extract"; exit 1; }
          echo "[data] DATA=$DATA ($(ls "$DATA" | wc -l) files)"

          export BN_N_PART=10
          # spec: <wandb-run-display-name>|<base-variant>|<seed>|<size>|<npz-tag>
          SPECS="r8-small-w1a8-std-s1|w1a8|1|small|SMALL-W1A8-r8std-s1
          r8-small-w1a8-std-s2|w1a8|2|small|SMALL-W1A8-r8std-s2
          r8-small-w1a8-std-s3|w1a8|3|small|SMALL-W1A8-r8std-s3
          r8-small-w1a8-stdnn-s1|w1a8|1|small|SMALL-W1A8-r8stdnn-s1
          r8-small-w1a8-stdnn-s2|w1a8|2|small|SMALL-W1A8-r8stdnn-s2
          r8-small-w1a8-stdnn-s3|w1a8|3|small|SMALL-W1A8-r8stdnn-s3
          r8-small-fp32-std-s1|fp32|1|small|SMALL-FP32-r8std-s1
          r8-small-fp32-std-s2|fp32|2|small|SMALL-FP32-r8std-s2
          r8-small-fp32-std-s3|fp32|3|small|SMALL-FP32-r8std-s3
          r8-small-w8a8-std-s1|w8a8|1|small|SMALL-W8A8-r8std-s1
          r8-small-w8a8-std-s2|w8a8|2|small|SMALL-W8A8-r8std-s2
          r8-small-w8a8-std-s3|w8a8|3|small|SMALL-W8A8-r8std-s3"
          echo "$SPECS" | while IFS='|' read -r RUN VARIANT SEED SIZE TAG; do
            RUN=$(echo "$RUN" | xargs)   # strip the heredoc indent
            [ -n "$RUN" ] || continue
            echo "[ckpt] $(date) fetch $RUN (exactly-one assertion + download-by-basename)"
            RUN_NAME="$RUN" python -u - <<'PYEOF'
          import os, wandb
          name = os.environ["RUN_NAME"]
          api = wandb.Api()
          # the display_name filter index can be stale after renames (measured 2026-07-15):
          # re-fetch each match by id and keep only authoritative name hits.
          cand = api.runs("kayamaguchi-uc-san-diego/bnjettag-final",
                          filters={"display_name": name})
          runs = [r for r in (api.run(f"kayamaguchi-uc-san-diego/bnjettag-final/{c.id}")
                              for c in cand) if r.display_name == name]
          assert len(runs) == 1, f"{name}: expected exactly 1 run, got {len(runs)}"
          run = runs[0]
          hits = [f for f in run.files() if f.name.endswith("model_best.keras")]
          assert len(hits) == 1, f"{name}: expected exactly 1 model_best.keras, got {[f.name for f in hits]}"
          stds = [f for f in run.files() if f.name.endswith("input_std.json")]
          assert len(stds) == 1, f"{name}: expected exactly 1 input_std.json, got {[f.name for f in stds]}"
          dst = f"/work/ckpt_dl/{name}"
          hits[0].download(root=dst, replace=True)
          stds[0].download(root=dst, replace=True)
          # normalize to fixed paths for the shell
          import glob, shutil
          src = glob.glob(f"{dst}/**/model_best.keras", recursive=True)[0]
          shutil.copy(src, f"{dst}.keras")
          srcj = glob.glob(f"{dst}/**/input_std.json", recursive=True)[0]
          shutil.copy(srcj, f"{dst}.input_std.json")
          print(f"[ckpt] {name} -> {dst}.keras + input_std.json", flush=True)
          PYEOF
            echo "[eval] $(date) $TAG (variant=$VARIANT seed=$SEED size=$SIZE)"
            python -u "$CODE/roc_final.py" eval \
              --keras "/work/ckpt_dl/$RUN.keras" \
              --input-std "/work/ckpt_dl/$RUN.input_std.json" \
              --variant "$VARIANT" --seed "$SEED" --size "$SIZE" \
              --data "$DATA" --npz "$OUT/$TAG.npz" \
              --expect-n 260000 --batch "${EVAL_BATCH:-4096}"
          done
          N=$(ls "$OUT"/*.npz | wc -l)
          [ "$N" -eq 12 ] || { echo "[fatal] expected 12 npz, got $N"; exit 1; }

          echo "[upload] $(date) durable copies -> W&B run r8x-roc-artifacts (project bnjettag-final)"
          python -u - <<'PYEOF'
          import glob, os, wandb
          run = wandb.init(project="bnjettag-final", name="r8x-roc-artifacts",
                           job_type="roc-artifacts")
          for p in sorted(glob.glob("/work/outputs/roc/*")):
              if os.path.isfile(p):
                  wandb.save(p, base_path="/work/outputs/roc", policy="now")
                  print("[upload]", p, flush=True)
          run.finish()
          PYEOF
          echo "[done] $(date) round-8 ROC (12 runs, GPU, PVC-free) complete -> W&B r7x-roc-artifacts"
        env:
        - name: EVAL_BATCH
          value: "4096"
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: kai-wandb
              key: WANDB_API_KEY
        resources:
          limits:
            nvidia.com/gpu: "1"
            cpu: "4"
            memory: 24Gi
            ephemeral-storage: 24Gi
          requests:
            nvidia.com/gpu: "1"
            cpu: "4"
            memory: 24Gi
            ephemeral-storage: 24Gi
        volumeMounts:
        - name: cmcode
          mountPath: /cmcode
        - name: work
          mountPath: /work
      volumes:
      - name: cmcode
        configMap:
          name: kai-bnf-code
      - name: work
        emptyDir:
          sizeLimit: 24Gi
